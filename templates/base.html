<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Liga MX Pronósticos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('mostrar_calendario') }}">Liga MX Pronósticos</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('mostrar_calendario') }}">Calendario</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('gestion_usuarios') }}">Usuarios</a>
                    </li>
                    <li class="nav-item">
                        {% if jornada_activa %}
                            <a class="nav-link" href="{{ url_for('captura_pronosticos_jornada', jornada=jornada_activa) }}">
                                Captura Pronósticos
                            </a>
                        {% else %}
                            <a class="nav-link disabled" href="#">Captura Pronósticos</a>
                        {% endif %}
                    </li>
                    <li class="nav-item">
                        {% if jornada_activa %}
                            <a class="nav-link" href="{{ url_for('evaluar_pronosticos_jornada', jornada=jornada_activa) }}">
                                Evaluar Pronósticos
                            </a>
                        {% else %}
                            <a class="nav-link disabled" href="#">Evaluar Pronósticos</a>
                        {% endif %}
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido de la página -->
    <div class="container-fluid px-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
