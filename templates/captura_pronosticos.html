{% extends "base.html" %}
{% block title %}Captura de Pronósticos{% endblock %}

{% block content %}
<h1>Captura de Pronósticos</h1>
<form method="POST" action="{{ url_for('captura_pronosticos_jornada', jornada=jornada_activa) }}">
    <div class="mb-3">
        <label for="usuario" class="form-label">Usuario</label>
        <select class="form-select" id="usuario" name="usuario" required>
            {% for u in usuarios %}
            <option value="{{ u.id }}">{{ u.nombre }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="jornada" class="form-label">Jornada</label>
        <select class="form-select" id="jornada" name="jornada" required>
            {% for round_number in rounds.keys() %}
            <option value="{{ round_number }}">Jornada {{ round_number }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Pronósticos</label>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Local</th>
                    <th>Visitante</th>
                    <th>Pronóstico</th>
                </tr>
            </thead>
            <tbody>
                {% for event in eventos %}
                <tr>
                    <td>{{ event.homeTeam.name }}</td>
                    <td>{{ event.awayTeam.name }}</td>
                    <td>
                        <select class="form-select" name="pronostico_{{ event.id }}">
                            <option value="local">Local</option>
                            <option value="empate">Empate</option>
                            <option value="visitante">Visitante</option>
                        </select>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <button type="submit" class="btn btn-success">Guardar Pronósticos</button>
</form>
{% endblock %}
